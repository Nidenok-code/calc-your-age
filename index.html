<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <title>Nidenok(find age)</title>
  </head>
  <body>
    <div class="continer">
      <form id="input">
        <div class="day inputDiv">
          <label for="day">DAY</label>
          <input type="text" name="day" placeholder="DD" maxlength="2" />
          <span></span>
        </div>
        <div class="month inputDiv">
          <label for="month">MONTH</label>
          <input type="text" name="month" placeholder="MM" maxlength="2" />
          <span></span>
        </div>
        <div class="year inputDiv">
          <label for="year">YEAR</label>
          <input type="text" name="year" placeholder="YYYY" maxlength="4" />
          <span></span>
        </div>
      </form>
      <div class="btn">
        <div class="line"></div>
        <button>
          <svg
            width="46"
            height="44"
            viewBox="0 0 46 44"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M1 22.0189C8.33333 21.6859 23 25.6158 23 44"
              stroke="white"
              stroke-width="2"
            />
            <path d="M23 44V0" stroke="white" stroke-width="2" />
            <path
              d="M45 22.0189C37.6667 21.6859 23 25.6158 23 44"
              stroke="white"
              stroke-width="2"
            />
          </svg>
        </button>
      </div>
      <div class="output">
        <p class="outText"><span class="outputSpan">- -</span>years</p>
        <p class="outText"><span class="outputSpan">- -</span>months</p>
        <p class="outText"><span class="outputSpan">- -</span>days</p>
      </div>
    </div>
  </body>
  <script src="./js/main.js"></script>
</html>
